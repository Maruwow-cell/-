<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 미리보기</title>
<style>
  html,body{ margin:0; padding:0; background:#b9b1a4; overflow:hidden; }
  iframe{ display:block; border:0; background:#fff; }
</style>
</head>
<body>
<iframe id="f" src="care.html" title="미리보기" scrolling="no"></iframe>
<script>
  var p = new URLSearchParams(location.search);
  var w = Number(p.get('w') || 390);
  var h = Number(p.get('h') || 844);
  var f = document.getElementById('f');
  f.style.width = w + 'px';
  f.style.height = h + 'px';
  f.src = p.get('u') || 'care.html';
  document.title = w + 'x' + h;
</script>
</body>
</html>
